name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install luacheck
        run: sudo apt-get update && sudo apt-get install -y lua-check

      - name: Run luacheck
        run: luacheck Hanten.spoon/init.lua

      - name: Check version consistency (init.lua vs docs/docs.json)
        run: |
          INIT_VERSION=$(grep -oE 'obj\.version = "[^"]+"' Hanten.spoon/init.lua | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          DOCS_VERSION=$(grep -oE '"version": "[^"]+"' docs/docs.json | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "init.lua: $INIT_VERSION / docs/docs.json: $DOCS_VERSION"
          test "$INIT_VERSION" = "$DOCS_VERSION"

  # The zip is only regenerated by version.sh at release time, so it is allowed
  # to lag behind source commits on main; enforce sync on release tags only.
  release-zip-sync:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify zip matches source
        run: |
          unzip -q Spoons/Hanten.spoon.zip -d /tmp/zipcheck
          diff -r Hanten.spoon /tmp/zipcheck/Hanten.spoon

      - name: Verify tag matches version
        run: |
          INIT_VERSION=$(grep -oE 'obj\.version = "[^"]+"' Hanten.spoon/init.lua | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "init.lua: $INIT_VERSION / tag: $TAG_VERSION"
          test "$INIT_VERSION" = "$TAG_VERSION"
